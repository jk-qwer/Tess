<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단톡방 페르소나 분석기</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas CDN (1장 캡처 다운로드용) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4 sm:px-6 lg:px-8">

  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Header -->
    <header class="text-center space-y-2">
      <div class="inline-flex items-center gap-2 px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-xs font-bold tracking-wide">
        <span>⚡ AI CHATROOM PERSONA</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">단톡방 페르소나 분석기</h1>
      <p class="text-sm text-slate-500">대화 내용을 넣으면 멤버들의 성향을 분석해 동물, 자동차, SNS 등으로 비유해 드립니다.</p>
    </header>

    <!-- 1. Input Section -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6 space-y-4">
      
      <!-- Input Tabs -->
      <div class="flex border-b border-slate-200 gap-4 text-sm font-semibold">
        <button id="tab-text" onclick="switchInputTab('text')" class="pb-3 text-indigo-600 border-b-2 border-indigo-600">직접 입력 / 복사붙여넣기</button>
        <button id="tab-file" onclick="switchInputTab('file')" class="pb-3 text-slate-400 hover:text-slate-600 border-b-2 border-transparent">.txt 파일 업로드</button>
        <button id="tab-image" onclick="switchInputTab('image')" class="pb-3 text-slate-400 hover:text-slate-600 border-b-2 border-transparent">캡처 사진 업로드 (최대 15장)</button>
      </div>

      <!-- Text Area Panel -->
      <div id="panel-text" class="space-y-2">
        <textarea id="chat-input" rows="6" placeholder="카카오톡 대화 내용을 복사해서 붙여넣으세요... (예시 데이터는 '샘플 불러오기' 클릭)" class="w-full p-3 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono"></textarea>
      </div>

      <!-- File Upload Panel -->
      <div id="panel-file" class="hidden">
        <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-xl p-8 hover:bg-slate-50 cursor-pointer">
          <i data-lucide="file-text" class="w-10 h-10 text-slate-400 mb-2"></i>
          <span class="text-sm font-semibold text-slate-700">카카오톡 '대화 내보내기' .txt 파일 선택</span>
          <span class="text-xs text-slate-400 mt-1">UTF-8 형식 지원</span>
          <input type="file" id="txt-file-input" accept=".txt" class="hidden" onchange="handleTxtUpload(event)">
        </label>
        <p id="file-name" class="text-xs text-indigo-600 font-semibold mt-2 hidden"></p>
      </div>

      <!-- Image Upload Panel -->
      <div id="panel-image" class="hidden space-y-3">
        <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-xl p-8 hover:bg-slate-50 cursor-pointer">
          <i data-lucide="images" class="w-10 h-10 text-slate-400 mb-2"></i>
          <span class="text-sm font-semibold text-slate-700">대화방 캡처 스크린샷 선택 (최대 15장)</span>
          <span class="text-xs text-slate-400 mt-1">말투와 맥락이 잘 드러난 이미지를 권장합니다</span>
          <input type="file" id="img-file-input" accept="image/*" multiple class="hidden" onchange="handleImgUpload(event)">
        </label>
        <div id="image-preview" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- Control Buttons -->
      <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
        <button onclick="loadSampleData()" class="text-xs font-semibold text-slate-500 hover:text-indigo-600 flex items-center gap-1">
          <i data-lucide="sparkles" class="w-4 h-4"></i> 방금 대화방 샘플 불러오기
        </button>
        <div class="flex gap-2">
          <button onclick="clearAll()" class="px-4 py-2 text-xs font-semibold text-slate-500 hover:bg-slate-100 rounded-xl">초기화</button>
          <button onclick="analyzeChat()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl shadow-sm transition flex items-center gap-2">
            <i data-lucide="play" class="w-4 h-4"></i> 페르소나 분석 실행
          </button>
        </div>
      </div>

    </div>

    <!-- 2. Result Section -->
    <div id="result-section" class="space-y-4 hidden">
      
      <!-- Theme Selection Bar -->
      <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-3 rounded-2xl border border-slate-200">
        <div class="flex flex-wrap gap-1.5" id="theme-buttons">
          <button onclick="setTheme('animal')" id="btn-animal" class="theme-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white">🦁 동물</button>
          <button onclick="setTheme('car')" id="btn-car" class="theme-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200">🚗 자동차</button>
          <button onclick="setTheme('sns')" id="btn-sns" class="theme-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200">📱 SNS</button>
          <button onclick="setTheme('subway')" id="btn-subway" class="theme-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200">🚇 6호선 역</button>
          <button onclick="setTheme('snack')" id="btn-snack" class="theme-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200">🍢 분식 메뉴</button>
        </div>
        
        <!-- View Toggle & Export -->
        <div class="flex items-center gap-2">
          <div class="bg-slate-100 p-0.5 rounded-lg flex text-xs">
            <button onclick="setView('card')" id="view-card-btn" class="px-2.5 py-1 rounded-md font-bold bg-white text-slate-800 shadow-sm">카드</button>
            <button onclick="setView('table')" id="view-table-btn" class="px-2.5 py-1 rounded-md font-bold text-slate-500">표</button>
          </div>
          <button onclick="downloadCapture()" class="p-2 bg-slate-900 text-white rounded-lg hover:bg-slate-800 text-xs font-bold flex items-center gap-1 shadow-sm" title="인스타/공유용 1장 이미지 다운로드">
            <i data-lucide="camera" class="w-3.5 h-3.5"></i> 1장 캡처
          </button>
          <button onclick="copyToClipboard()" class="p-2 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 text-xs font-bold flex items-center gap-1" title="단톡방용 텍스트 복사">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i> 복사
          </button>
        </div>
      </div>

      <!-- Capture Target Container -->
      <div id="capture-container" class="bg-gradient-to-br from-indigo-50 via-white to-slate-50 p-6 sm:p-8 rounded-3xl border border-indigo-100 shadow-md space-y-6">
        
        <!-- Result Header -->
        <div class="flex justify-between items-end border-b border-indigo-100 pb-4">
          <div>
            <span class="text-xs font-extrabold text-indigo-600 tracking-wider uppercase">Chatroom Analysis Report</span>
            <h2 id="result-title" class="text-xl sm:text-2xl font-black text-slate-900 mt-0.5">🦁 멤버별 동물 페르소나</h2>
          </div>
          <div class="text-right">
            <span class="text-[10px] text-slate-400 font-mono">Analyzed by Persona AI</span>
          </div>
        </div>

        <!-- View 1: Card View -->
        <div id="card-view" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>

        <!-- View 2: Table View -->
        <div id="table-view" class="hidden overflow-x-auto">
          <table class="w-full text-left text-sm border-collapse bg-white rounded-xl overflow-hidden shadow-sm border border-slate-200">
            <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
              <tr>
                <th class="p-3 w-1/4">멤버 (닉네임)</th>
                <th class="p-3 w-1/3">매칭 결과</th>
                <th class="p-3">매칭 이유 및 특징</th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>

        <!-- Footer watermark on capture -->
        <div class="text-center pt-2">
          <p class="text-[11px] font-semibold text-indigo-400">✨ 우리 단톡방 맞춤 분석 완료 ✨</p>
        </div>
      </div>

    </div>

  </div>

    const themeTitles = {

    // Tab Switcher
    function switchInputTab(tab) {
      ['text', 'file', 'image'].forEach(t => {
        document.getElementById(`panel-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'pb-3 text-slate-400 hover:text-slate-600 border-b-2 border-transparent';
      });
      document.getElementById(`panel-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'pb-3 text-indigo-600 border-b-2 border-indigo-600 font-bold';
    }

    // Load Sample Data
    function loadSampleData() {
      switchInputTab('text');
      document.getElementById('chat-input').value = "[Talk_2026.8.22 대화방 샘플 데이터가 로드되었습니다.]\n문멘토, 부동산여왕, 연혜(효니), 테스(최종관), 으쌰(이주연), 초록그린(W.S.H), 로로(인영) 총 7인의 대화 로그";
      analyzeChat();
    }

    function clearAll() {
      document.getElementById('chat-input').value = '';
      document.getElementById('result-section').classList.add('hidden');
    }

    function handleTxtUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        document.getElementById('chat-input').value = evt.target.result;
        document.getElementById('file-name').innerText = `✅ 파일 로드 완료: ${file.name}`;
        document.getElementById('file-name').classList.remove('hidden');
      };
      reader.readAsText(file, 'UTF-8');
    }

    function handleImgUpload(e) {
      const files = Array.from(e.target.files).slice(0, 15);
      const container = document.getElementById('image-preview');
      container.innerHTML = '';
      files.forEach(f => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(f);
        img.className = 'w-16 h-16 object-cover rounded-lg border border-slate-200';
        container.appendChild(img);
      });
    }

    // Trigger Analysis
    function analyzeChat() {
      document.getElementById('result-section').classList.remove('hidden');
      renderResults();
      document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
    }

    // Set Theme
    function setTheme(theme) {
      currentTheme = theme;
      document.querySelectorAll('.theme-btn').forEach(b => {
        b.className = 'theme-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200';
      });
      document.getElementById(`btn-${theme}`).className = 'theme-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white';
      document.getElementById('result-title').innerText = themeTitles[theme];
      renderResults();
    }

    // Set View
    function setView(view) {
      currentView = view;
      if (view === 'card') {
        document.getElementById('card-view').classList.remove('hidden');
        document.getElementById('table-view').classList.add('hidden');
        document.getElementById('view-card-btn').className = 'px-2.5 py-1 rounded-md font-bold bg-white text-slate-800 shadow-sm';
        document.getElementById('view-table-btn').className = 'px-2.5 py-1 rounded-md font-bold text-slate-500';
      } else {
        document.getElementById('card-view').classList.add('hidden');
        document.getElementById('table-view').classList.remove('hidden');
        document.getElementById('view-table-btn').className = 'px-2.5 py-1 rounded-md font-bold bg-white text-slate-800 shadow-sm';
        document.getElementById('view-card-btn').className = 'px-2.5 py-1 rounded-md font-bold text-slate-500';
      }
      renderResults();
    }

    // Render Data into Cards & Table
    function renderResults() {
      const cardContainer = document.getElementById('card-view');
      const tableBody = document.getElementById('table-body');
      cardContainer.innerHTML = '';
      tableBody.innerHTML = '';

      personaData.forEach((item, idx) => {
        const themeInfo = item[currentTheme];

        // Card HTML
        const card = document.createElement('div');
        card.className = "bg-white p-4 sm:p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition space-y-2 flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between">
              <span class="text-sm font-extrabold text-slate-900">${item.name}</span>
              <span class="text-[11px] font-semibold px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full">${item.role}</span>
            </div>
            <div class="mt-2 text-base font-black text-indigo-600 tracking-tight">${themeInfo.tag}</div>
            <p class="text-xs text-slate-600 leading-relaxed mt-1">${themeInfo.desc}</p>
          </div>
        `;
        cardContainer.appendChild(card);

        // Table Row HTML
        const row = document.createElement('tr');
        row.className = idx % 2 === 0 ? "bg-white" : "bg-slate-50/50";
        row.innerHTML = `
          <td class="p-3 font-bold text-slate-900">${item.name} <span class="block text-[11px] font-normal text-slate-400">${item.role}</span></td>
          <td class="p-3 font-bold text-indigo-600">${themeInfo.tag}</td>
          <td class="p-3 text-xs text-slate-600 leading-relaxed">${themeInfo.desc}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    // 1-Click Image Capture & Download
    async function downloadCapture() {
      const container = document.getElementById('capture-container');
      const canvas = await html2canvas(container, { scale: 2 });
      const link = document.createElement('a');
      link.download = `단톡방_페르소나_${currentTheme}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Copy formatted text to clipboard
    function copyToClipboard() {
      let text = `[${themeTitles[currentTheme]}]\n\n`;
      personaData.forEach(item => {
        text += `▪ ${item.name} (${item.role})\n→ ${item[currentTheme].tag} : ${item[currentTheme].desc}\n\n`;
      });
      navigator.clipboard.writeText(text).then(() => {
        alert("단톡방에 바로 공유할 수 있도록 텍스트가 복사되었습니다!");
      });
    }
  </script>
</body>
</html>
