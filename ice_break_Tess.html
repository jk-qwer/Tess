<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>문멘토 6호선 프로젝트 - 단톡방 페르소나 분석기</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas CDN (고화질 캡처 다운로드) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Tesseract.js (다중 사진 OCR 판독) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
    body { 
      font-family: 'Pretendard', sans-serif;
      /* 서울 롯데타워 야경 감성 배경 */
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.88) 0%, rgba(10, 15, 29, 0.94) 100%),
                  url('https://images.unsplash.com/photo-1578637387939-43c525550085?auto=format&fit=crop&w=1200&q=80') no-repeat center center fixed;
      background-size: cover;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen py-8 px-4 sm:px-6 lg:px-8">

  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Header -->
    <header class="text-center space-y-2">
      <div class="inline-flex items-center gap-2 px-3 py-1 bg-amber-500/10 border border-amber-500/30 text-amber-300 rounded-full text-xs font-bold tracking-wide">
        <span>🏛️ MUN MENTOR 6호선 프로젝트</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">단톡방 페르소나 분석기</h1>
      <p class="text-xs sm:text-sm text-slate-300">“스터디의 메인 주제였던 6호선 주요 역세권의 입지적·공간적 특징에 빗댄 멤버별 매칭입니다.”</p>
    </header>

    <!-- 1. Input Section -->
    <div class="glass-card rounded-2xl shadow-xl p-5 sm:p-6 space-y-4">
      
      <!-- Input Tabs -->
      <div class="flex border-b border-white/10 gap-4 text-sm font-semibold">
        <button id="tab-text" onclick="switchInputTab('text')" class="pb-3 text-amber-400 border-b-2 border-amber-400">직접 입력 / 복사붙여넣기</button>
        <button id="tab-file" onclick="switchInputTab('file')" class="pb-3 text-slate-400 hover:text-slate-200 border-b-2 border-transparent">.txt 파일 업로드</button>
        <button id="tab-image" onclick="switchInputTab('image')" class="pb-3 text-slate-400 hover:text-slate-200 border-b-2 border-transparent">캡처 사진 업로드 (최대 15장)</button>
      </div>

      <!-- Text Area Panel -->
      <div id="panel-text" class="space-y-2">
        <textarea id="chat-input" rows="5" placeholder="카톡 대화 내용을 붙여넣으세요. (아무것도 입력하지 않고 분석 실행 시 '6호선 7인방 결과'가 표시됩니다)" class="w-full p-3 text-xs sm:text-sm rounded-xl bg-black/40 border border-white/15 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 font-mono"></textarea>
      </div>

      <!-- File Upload Panel -->
      <div id="panel-file" class="hidden">
        <label class="flex flex-col items-center justify-center border-2 border-dashed border-white/20 rounded-xl p-8 hover:bg-white/5 cursor-pointer">
          <i data-lucide="file-text" class="w-10 h-10 text-slate-400 mb-2"></i>
          <span class="text-sm font-semibold text-slate-200">카카오톡 '대화 내보내기' .txt 파일 선택</span>
          <span class="text-xs text-slate-400 mt-1">UTF-8 형식 지원</span>
          <input type="file" id="txt-file-input" accept=".txt" class="hidden" onchange="handleTxtUpload(event)">
        </label>
        <p id="file-name" class="text-xs text-amber-400 font-semibold mt-2 hidden"></p>
      </div>

      <!-- Image Upload Panel -->
      <div id="panel-image" class="hidden space-y-3">
        <label class="flex flex-col items-center justify-center border-2 border-dashed border-white/20 rounded-xl p-8 hover:bg-white/5 cursor-pointer">
          <i data-lucide="images" class="w-10 h-10 text-slate-400 mb-2"></i>
          <span class="text-sm font-semibold text-slate-200">대화방 캡처 스크린샷 선택 (최대 15장)</span>
          <span class="text-xs text-slate-400 mt-1">OCR 문자 인식을 통해 자동으로 텍스트를 추출합니다</span>
          <input type="file" id="img-file-input" accept="image/*" multiple class="hidden" onchange="handleImgUpload(event)">
        </label>
        <div id="ocrLoading" class="hidden p-2.5 bg-amber-500/10 border border-amber-500/30 rounded-xl text-center">
          <p id="ocrStatus" class="text-xs text-amber-300 font-bold animate-pulse">📷 사진 판독 중...</p>
        </div>
        <div id="image-preview" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- Control Buttons -->
      <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
        <button onclick="loadSampleData()" class="text-xs font-semibold text-amber-300 hover:text-amber-200 flex items-center gap-1">
          <i data-lucide="sparkles" class="w-4 h-4"></i> 6호선 7인방 원본 불러오기
        </button>
        <div class="flex gap-2">
          <button onclick="clearAll()" class="px-4 py-2 text-xs font-semibold text-slate-300 hover:bg-white/10 rounded-xl">초기화</button>
          <button onclick="analyzeChat()" class="px-5 py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 text-slate-950 text-sm font-bold rounded-xl shadow-lg shadow-amber-500/20 transition flex items-center gap-2 active:scale-95">
            <i data-lucide="play" class="w-4 h-4"></i> 페르소나 분석 실행
          </button>
        </div>
      </div>

    </div>

    <!-- 2. Result Section -->
    <div id="result-section" class="space-y-4">
      
      <!-- Theme Selection Bar -->
      <div class="flex flex-wrap items-center justify-between gap-3 glass-card p-3 rounded-2xl">
        <div class="flex flex-wrap gap-1.5" id="theme-buttons">
          <button onclick="setTheme('animal')" id="btn-animal" class="theme-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950">🦁 동물</button>
          <button onclick="setTheme('car')" id="btn-car" class="theme-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-white/10 text-slate-300 hover:bg-white/20">🚗 자동차</button>
          <button onclick="setTheme('sns')" id="btn-sns" class="theme-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-white/10 text-slate-300 hover:bg-white/20">📱 SNS</button>
          <button onclick="setTheme('subway')" id="btn-subway" class="theme-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-white/10 text-slate-300 hover:bg-white/20">🚇 6호선 역</button>
          <button onclick="setTheme('snack')" id="btn-snack" class="theme-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-white/10 text-slate-300 hover:bg-white/20">🍢 분식 메뉴</button>
        </div>
        
        <!-- View Toggle & Export -->
        <div class="flex items-center gap-2">
          <div class="bg-black/40 p-0.5 rounded-lg flex text-xs border border-white/10">
            <button onclick="setView('card')" id="view-card-btn" class="px-2.5 py-1 rounded-md font-bold bg-amber-500 text-slate-950 shadow-sm">카드</button>
            <button onclick="setView('table')" id="view-table-btn" class="px-2.5 py-1 rounded-md font-bold text-slate-400">표</button>
          </div>
          <button onclick="downloadCapture()" id="captureBtn" class="p-2 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 rounded-lg hover:from-amber-600 text-xs font-bold flex items-center gap-1 shadow-sm" title="인스타/공유용 1장 이미지 다운로드">
            <i data-lucide="camera" class="w-3.5 h-3.5"></i> 1장 캡처
          </button>
          <button onclick="copyToClipboard()" class="p-2 bg-white/10 text-slate-200 rounded-lg hover:bg-white/20 text-xs font-bold flex items-center gap-1" title="단톡방용 텍스트 복사">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i> 복사
          </button>
        </div>
      </div>

      <!-- Capture Target Container -->
      <div id="capture-container" class="bg-slate-900/95 p-6 sm:p-8 rounded-3xl border border-amber-500/30 shadow-2xl space-y-6 text-white">
        
        <!-- Result Header -->
        <div class="flex justify-between items-end border-b border-white/10 pb-4">
          <div>
            <span class="text-xs font-extrabold text-amber-400 tracking-wider uppercase">MUN MENTOR LINE 6 PROJECT</span>
            <h2 id="result-title" class="text-xl sm:text-2xl font-black text-white mt-0.5">🦁 멤버별 동물 페르소나</h2>
          </div>
          <div class="text-right">
            <span class="text-[10px] text-slate-400 font-mono">Developed by Tess</span>
          </div>
        </div>

        <!-- View 1: Card View -->
        <div id="card-view" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>

        <!-- View 2: Table View -->
        <div id="table-view" class="hidden overflow-x-auto">
          <table class="w-full text-left text-xs sm:text-sm border-collapse bg-slate-950/60 rounded-xl overflow-hidden border border-white/10">
            <thead class="bg-white/10 text-amber-300 font-bold border-b border-white/10">
              <tr>
                <th class="p-3 w-1/4">멤버 (닉네임)</th>
                <th class="p-3 w-1/3">매칭 결과</th>
                <th class="p-3">매칭 이유 및 특징</th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-white/5"></tbody>
          </table>
        </div>

        <!-- Footer watermark on capture -->
        <div class="text-center pt-2">
          <p class="text-[11px] font-semibold text-amber-400/80">✨ 맞춤 페르소나 분석 완료 ✨</p>
        </div>
      </div>

    </div>

  </div>

  <!-- 모바일 사진 저장 모달 -->
  <div id="imageModal" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl p-5 max-w-sm w-full flex flex-col items-center shadow-2xl">
      <div class="w-full flex justify-between items-center mb-3">
        <span class="text-xs font-bold text-amber-400">📸 캡처 완료!</span>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-base font-bold">✕</button>
      </div>
      <p class="text-xs text-slate-300 text-center mb-3">
        모바일은 아래 이미지를 <span class="text-amber-300 font-bold">길게 꾹 눌러 '사진 앱에 저장'</span>하세요!
      </p>
      <div class="w-full rounded-2xl overflow-hidden border border-white/20 shadow-inner mb-4 max-h-[60vh] overflow-y-auto">
        <img id="resultImage" class="w-full h-auto object-contain" src="" alt="Captured Result" />
      </div>
      <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold">
        닫기
      </button>
    </div>
  </div>

    let currentTheme = 'animal';
    let currentView = 'card';

    function switchInputTab(tab) {
      ['text', 'file', 'image'].forEach(t => {
        document.getElementById(`panel-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'pb-3 text-slate-400 hover:text-slate-200 border-b-2 border-transparent';
      });
      document.getElementById(`panel-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'pb-3 text-amber-400 border-b-2 border-amber-400 font-bold';
    }

    function loadSampleData() {
      switchInputTab('text');
      document.getElementById('chat-input').value = '';
      currentPersonaData = [...defaultPersonaData];
      renderResults();
      document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
    }

    function clearAll() {
      document.getElementById('chat-input').value = '';
      document.getElementById('file-name').classList.add('hidden');
      document.getElementById('image-preview').innerHTML = '';
      currentPersonaData = [...defaultPersonaData];
      renderResults();
    }

    function handleTxtUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        document.getElementById('chat-input').value = evt.target.result;
        document.getElementById('file-name').innerText = `✅ 파일 로드 완료: ${file.name}`;
        document.getElementById('file-name').classList.remove('hidden');
      };
      reader.readAsText(file, 'UTF-8');
    }

    async function handleImgUpload(e) {
      const files = Array.from(e.target.files).slice(0, 15);
      if (files.length === 0) return;

      const container = document.getElementById('image-preview');
      container.innerHTML = '';
      files.forEach(f => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(f);
        img.className = 'w-16 h-16 object-cover rounded-lg border border-white/20';
        container.appendChild(img);
      });

      const loadingBox = document.getElementById('ocrLoading');
      const statusText = document.getElementById('ocrStatus');
      loadingBox.classList.remove('hidden');

      let combinedText = document.getElementById('chat-input').value;
      const total = files.length;

      try {
        const worker = await Tesseract.createWorker('kor+eng');
        for (let i = 0; i < total; i++) {
          statusText.innerText = `📷 사진 분석 중... (${i + 1}/${total}장 완료)`;
          const ret = await worker.recognize(files[i]);
          combinedText += `\n${ret.data.text}`;
        }
        await worker.terminate();

        document.getElementById('chat-input').value = combinedText;
        loadingBox.classList.add('hidden');
        alert(`총 ${total}장의 사진에서 대화 텍스트를 모두 읽어왔습니다!`);
      } catch (err) {
        console.error(err);
        loadingBox.classList.add('hidden');
        alert('사진 인식 중 오류가 발생했습니다.');
      }
    }

    // 핵심: 대화 텍스트 존재 여부에 따라 분기 실행
    function analyzeChat() {
      const text = document.getElementById('chat-input').value.trim();

      // [분기 1] 입력된 대화가 없으면 -> 기본 7인방 원본 표시
      if (!text) {
        currentPersonaData = [...defaultPersonaData];
        renderResults();
        document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
        return;
      }

      // [분기 2] 실제 텍스트가 있으면 -> 대화 내용 파싱 및 실제 분석
      const lines = text.split('\n');
      const userCounts = {};
      const regex = /\[(.*?)\]\s+\[(.*?)\]\s+(.*)/;

      lines.forEach(line => {
        const match = line.match(regex);
        if (match) {
          const user = match[1].trim();
          userCounts[user] = (userCounts[user] || 0) + 1;
        }
      });

      const userList = Object.keys(userCounts);

      // 카톡 정규식 포맷이 아니더라도 쉼표/줄바꿈 등으로 이름이 나열된 경우 대비
      if (userList.length === 0) {
        const words = text.split(/[\n,]+/).map(w => w.trim()).filter(w => w.length >= 2 && w.length <= 10);
        const uniqueWords = [...new Set(words)].slice(0, 8);
        
        if (uniqueWords.length > 0) {
          currentPersonaData = uniqueWords.map((name, i) => {
            const p = personaPool[i % personaPool.length];
            return {
              name: name,
              role: p.role,
              animal: p.animal,
              car: p.car,
              sns: p.sns,
              subway: p.subway,
              snack: p.snack
            };
          });
        } else {
          currentPersonaData = [...defaultPersonaData];
        }
      } else {
        // 실제 추출된 멤버들로 동적 페르소나 카드 생성
        currentPersonaData = userList.map((user, i) => {
          const p = personaPool[i % personaPool.length];
          const count = userCounts[user];
          return {
            name: `${user}`,
            role: `${p.role} (발언 ${count}회)`,
            animal: p.animal,
            car: p.car,
            sns: p.sns,
            subway: p.subway,
            snack: p.snack
          };
        });
      }

      renderResults();
      document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
    }

      currentTheme = theme;
      document.querySelectorAll('.theme-btn').forEach(b => {
        b.className = 'theme-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-white/10 text-slate-300 hover:bg-white/20';

        document.getElementById('card-view').classList.remove('hidden');

      } else {
        document.getElementById('card-view').classList.add('hidden');
        document.getElementById('table-view').classList.remove('hidden');
        document.getElementById('view-table-btn').className = 'px-2.5 py-1 rounded-md font-bold bg-amber-500 text-slate-950 shadow-sm';
        document.getElementById('view-card-btn').className = 'px-2.5 py-1 rounded-md font-bold text-slate-400';

      renderResults();
    }

    function renderResults() {
      const cardContainer = document.getElementById('card-view');
      const tableBody = document.getElementById('table-body');
      cardContainer.innerHTML = '';
      tableBody.innerHTML = '';

      currentPersonaData.forEach((item, idx) => {
        const themeInfo = item[currentTheme];

        const card = document.createElement('div');
        card.className = "bg-slate-950/70 p-4 sm:p-5 rounded-2xl border border-white/10 shadow-sm hover:border-amber-500/40 transition space-y-2 flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between">
              <span class="text-sm font-extrabold text-white">${item.name}</span>
              <span class="text-[11px] font-semibold px-2 py-0.5 bg-amber-500/20 text-amber-300 rounded-full">${item.role}</span>
            </div>
            <div class="mt-2 text-base font-black text-amber-400 tracking-tight">${themeInfo.tag}</div>
            <p class="text-xs text-slate-300 leading-relaxed mt-1">${themeInfo.desc}</p>
          </div>
        `;
        cardContainer.appendChild(card);

        const row = document.createElement('tr');
        row.className = idx % 2 === 0 ? "bg-white/5" : "bg-transparent";
        row.innerHTML = `
          <td class="p-3 font-bold text-white">${item.name} <span class="block text-[11px] font-normal text-slate-400">${item.role}</span></td>
          <td class="p-3 font-bold text-amber-400">${themeInfo.tag}</td>
          <td class="p-3 text-xs text-slate-300 leading-relaxed">${themeInfo.desc}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    async function downloadCapture() {
      const btn = document.getElementById('captureBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '⏳ 캡처 중...';
      btn.disabled = true;

      const container = document.getElementById('capture-container');
      try {
        const canvas = await html2canvas(container, { scale: 2.5, backgroundColor: '#0F172A', useCORS: true });
        const imageUri = canvas.toDataURL('image/png');

        const link = document.createElement('a');
        link.download = `문멘토_페르소나_${currentTheme}.png`;
        link.href = imageUri;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        document.getElementById('resultImage').src = imageUri;
        const modal = document.getElementById('imageModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      } catch (err) {
        alert('캡처 저장 중 문제가 발생했습니다.');
        console.error(err);
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    function closeModal() {
      const modal = document.getElementById('imageModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function copyToClipboard() {
      let text = `[${themeTitles[currentTheme]}]\n“스터디의 메인 주제였던 6호선 주요 역세권의 입지적·공간적 특징에 빗댄 멤버별 매칭입니다.”\n\n`;
      currentPersonaData.forEach(item => {
        text += `▪ ${item.name} (${item.role})\n→ ${item[currentTheme].tag} : ${item[currentTheme].desc}\n\n`;
      });
      navigator.clipboard.writeText(text).then(() => {
        alert("단톡방에 바로 공유할 수 있도록 텍스트가 복사되었습니다!");
      });
    }

    window.onload = function() {
      lucide.createIcons();
